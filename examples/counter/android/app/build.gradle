plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.go2apkapp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.go2apkapp'
        minSdk 23
        targetSdk 36
        versionName '0.1.0'
        versionCode 1
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('buildGoApp') {
    description = 'Builds the Go JNI library.'
    group = 'build'
    def script = rootProject.file('../scripts/build-go-app.sh')
    inputs.dir(rootProject.file('../native/app'))
    outputs.dir(project.file('src/main/jniLibs'))
    doLast {
        exec {
            workingDir rootProject.file('..')
            commandLine 'bash', script.absolutePath
        }
    }
}

preBuild.dependsOn('buildGoApp')
