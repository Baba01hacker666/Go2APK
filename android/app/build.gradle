plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.signed'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.signed'
        minSdk 24
        targetSdk 36
        versionName '1.0.0'
        versionCode 1
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile rootProject.file('../release.keystore')
            storePassword "hunter2"
            keyAlias "mykey"
            keyPassword "hunter3"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('buildGoApp', Exec) {
    description = 'Builds the Go JNI library.'
    group = 'build'
    def script = rootProject.file('../scripts/build-go-app.sh')
    inputs.dir(rootProject.file('.././examples/demo'))
    outputs.dir(project.file('src/main/jniLibs'))
    workingDir rootProject.file('..')
    commandLine 'bash', script.absolutePath, './examples/demo'
}

preBuild.dependsOn('buildGoApp')
