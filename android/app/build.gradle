plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.go2apkapp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.go2apkapp'
        minSdk 23
        targetSdk 36
        versionName '0.1.0'
        versionCode 1
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        // No keystore configured; release builds fall back to the debug key.
        // Set keystore, key_alias, keystore_password and key_password in
        // go2apk.yaml (or the GO2APK_* environment variables) to ship a
        // properly signed artifact.
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('buildGoApp', Exec) {
    description = 'Builds the Go JNI library.'
    group = 'build'
    def script = rootProject.file('../scripts/build-go-app.sh')
    inputs.dir(rootProject.file('.././examples/demo'))
    outputs.dir(project.file('src/main/jniLibs'))
    workingDir rootProject.file('..')
    commandLine 'bash', script.absolutePath, './examples/demo'
}

preBuild.dependsOn('buildGoApp')
